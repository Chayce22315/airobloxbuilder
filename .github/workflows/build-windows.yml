name: build windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: test native core
        run: cargo test --manifest-path src/core/Cargo.toml

      - name: test ai layer
        shell: pwsh
        run: |
          python -m pip install pytest
          $env:PYTHONPATH = "src/ai"
          python -m pytest src/ai/tests

      - name: build windows app
        run: dotnet publish src/windows/AiroRobloxBuilder.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/windows

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: airobloxbuilder-windows
          path: artifacts/windows/

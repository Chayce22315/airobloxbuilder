name: airo specialist fine-tuning factory

on:
  push:
    paths:
      - "training/**"
  workflow_dispatch:
    inputs:
      agent:
        description: "specialist to fine-tune"
        required: true
        default: "code"
        type: choice
        options:
          - code
          - design
          - animation
          - testing
      model_override:
        description: "optional Hugging Face model id override"
        required: false
        type: string
      epochs:
        description: "training epochs"
        required: false
        default: "1"
        type: string
      examples_per_agent:
        description: "G.H.H.Q.S.D. examples to generate for the selected specialist"
        required: false
        default: "12000"
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: validate agent definitions and seed datasets
        run: python training/validate.py
      - name: compile specialist factory
        run: python -m py_compile training/generate_ghh_qsd.py training/quality_gate.py training/train.py
      - name: inspect factory configuration
        run: |
          python - <<'PY'
          import json
          cfg = json.load(open("training/model_registry.json"))
          print(json.dumps(cfg["models"], indent=2))
          PY

  train:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    # Actual QLoRA training needs a self-hosted NVIDIA GPU runner.
    runs-on: [self-hosted, windows, x64, gpu]
    environment: model-training
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: show GPU
        run: nvidia-smi

      - name: install training stack
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers datasets accelerate peft bitsandbytes trl

      - name: generate G.H.H.Q.S.D. specialist corpus
        env:
          AGENT: ${{ inputs.agent }}
          EXAMPLES: ${{ inputs.examples_per_agent }}
        run: |
          python training/generate_ghh_qsd.py --agent $env:AGENT --examples-per-agent $env:EXAMPLES --output training/datasets

      - name: quality gate G.H.H.Q.S.D.
        env:
          AGENT: ${{ inputs.agent }}
        run: |
          python training/quality_gate.py "training/datasets/$env:AGENT.jsonl" --agent $env:AGENT

      - name: resolve specialist model
        id: model
        env:
          AGENT: ${{ inputs.agent }}
          MODEL_OVERRIDE: ${{ inputs.model_override }}
        run: |
          python -c "import json,os; cfg=json.load(open('training/model_registry.json')); agent=os.environ['AGENT']; model=os.environ['MODEL_OVERRIDE'] or cfg['models'][agent]['model_id']; print('model=' + model)" >> $env:GITHUB_OUTPUT

      - name: fine-tune specialist
        env:
          AGENT: ${{ inputs.agent }}
          MODEL: ${{ steps.model.outputs.model }}
          EPOCHS: ${{ inputs.epochs }}
        run: |
          python training/train.py --agent $env:AGENT --model $env:MODEL --method qlora --epochs $env:EPOCHS --dataset "training/datasets/$env:AGENT.jsonl" --output "models/adapters"

      - uses: actions/upload-artifact@v4
        with:
          name: airo-${{ inputs.agent }}-adapter
          path: models/adapters/${{ inputs.agent }}/

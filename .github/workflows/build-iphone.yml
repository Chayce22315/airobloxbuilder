name: build iphone ipa

on:
  push:
    paths:
      - "src/ios/**"
      - ".github/workflows/build-iphone.yml"
  pull_request:
    paths:
      - "src/ios/**"
      - ".github/workflows/build-iphone.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: build unsigned archive
        run: |
          xcodebuild -project src/ios/AiroRobloxBuilder.xcodeproj             -scheme airobloxbuilder             -sdk iphoneos             -configuration Release             -archivePath build/airobloxbuilder.xcarchive             archive             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""
      - name: package unsigned ipa
        run: |
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R build/airobloxbuilder.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r airobloxbuilder-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: airobloxbuilder-iphone-unsigned
          path: build/airobloxbuilder-unsigned.ipa
